<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 40px;
      background: #f3f5f3;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2440;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #c2c9c2;
        border-radius: 24px;
        padding: 40px;
      "
    >
      <span
        style="
          display: inline-block;
          background: #d1fae5;
          color: #022c22;
          border-radius: 999px;
          padding: 6px 12px;
          font-size: 11px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          margin-bottom: 16px;
        "
      >
        VERIFICÁ TU CUENTA
      </span>
      <h1
        style="
          margin: 0 0 16px;
          color: #059669;
          font-size: 34px;
          line-height: 1.2;
          font-weight: 800;
        "
      >
        Confirmá tu dirección de mail
      </h1>
      <p
        style="
          margin: 0 0 32px;
          color: #527a61;
          font-size: 15px;
          line-height: 1.6;
        "
      >
        Hacé click en el botón para activar tu cuenta. El enlace expira en 24
        horas.
      </p>
      <div>
        <a
          th:href="${verificationUrl}"
          style="
            display: inline-block;
            text-decoration: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-weight: 700;
            font-size: 14px;
            line-height: 1;
            color: #ffffff;
            background: #059669;
          "
        >
          Activar cuenta
        </a>
      </div>
      <p
        style="
          margin: 32px 0 0;
          padding-top: 24px;
          border-top: 1px solid #c2c9c2;
          color: #527a61;
          font-size: 12px;
          line-height: 1.6;
        "
      >
        Si no creaste una cuenta en ResQFood, ignorá este mail. El enlace es de
        uso único y expira en 24 horas.
      </p>
    </div>
  </body>
</html>
