<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 40px;
      background: #f3f5f3;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2440;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e2d7db;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 12px 32px rgba(25, 28, 26, 0.06);
      "
    >
      <span
        style="
          display: inline-block;
          background: #fde4ea;
          color: #9f1239;
          border-radius: 999px;
          padding: 6px 12px;
          font-size: 11px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          margin-bottom: 16px;
        "
        th:text="#{mail.badge.rejected}"
      ></span>
      <h1
        style="
          margin: 0 0 16px;
          color: #191c1a;
          font-size: 32px;
          line-height: 1.2;
          font-weight: 800;
          letter-spacing: -0.02em;
        "
        th:text="#{mail.title.rejected}"
      ></h1>
      <p
        style="
          margin: 0 0 28px;
          color: #5f6368;
          font-size: 15px;
          line-height: 1.6;
        "
        th:text="#{mail.text.rejectedExplanation}"
      ></p>
      <div
        style="
          background: #f3f5f3;
          border: 1px solid #e2d7db;
          border-radius: 18px;
          padding: 20px;
        "
      >
        <p
          style="
            margin: 0 0 8px;
            color: #1f2440;
            font-size: 14px;
            line-height: 1.6;
          "
        >
          <strong
            style="color: #9f1239"
            th:text="#{mail.label.reservationNumber}"
          ></strong
          >: #<span th:text="${reservationId}"></span>
        </p>
        <p
          style="
            margin: 0 0 8px;
            color: #1f2440;
            font-size: 14px;
            line-height: 1.6;
          "
        >
          <strong style="color: #9f1239" th:text="#{mail.label.pack}"></strong>:
          <span th:text="${packLabel}"></span>
        </p>
        <p style="margin: 0; color: #1f2440; font-size: 14px; line-height: 1.6">
          <strong
            style="color: #9f1239"
            th:text="#{mail.label.reservationDate}"
          ></strong
          >: <span th:text="${reservationDateStr}"></span>
        </p>
      </div>
      <p
        style="
          margin: 28px 0 0;
          padding-top: 20px;
          border-top: 1px solid #e2d7db;
          color: #6b7280;
          font-size: 12px;
          line-height: 1.6;
        "
        th:text="#{mail.footer.autoSent}"
      ></p>
    </div>
  </body>
</html>
